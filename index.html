<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riyadh Weather Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* OBS: Browser Source -> Local file -> this file. Width 520, Height 340 (scales with ?scale=). Background stays transparent. */
  :root { --scale: 1; --accent: #0E7C66; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, Arial, sans-serif; }

  #card {
    width: calc(360px * var(--scale));
    padding: calc(22px * var(--scale)) calc(26px * var(--scale));
    background: transparent;
    border: calc(2px * var(--scale)) solid transparent;
    border-radius: calc(22px * var(--scale));
    color: #fff;
    text-shadow: 0 0 6px rgba(0,0,0,.85), 0 2px 10px rgba(0,0,0,.7);
    font-size: calc(16px * var(--scale));
    opacity: 0; transform: translateY(12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  #card.on { opacity: 1; transform: none; }
  /* Add ?bg=1 to the URL for a dark panel behind the widget */
  #card.panel { background: rgba(10, 18, 30, .88); border-color: rgba(255,255,255,.14); border-top: calc(5px * var(--scale)) solid var(--accent); text-shadow: none; }
  #card:not(.panel) svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }

  .head { display: flex; justify-content: center; align-items: baseline; }
  .city { font-size: 1.5em; font-weight: 600; }
  .city span { font-weight: 400; opacity: .85; margin-inline-start: .3em; font-size: 1.2em; }
  .clock { font-size: 1.1em; color: #9fb4c8; font-variant-numeric: tabular-nums; }

  .main { display: flex; justify-content: center; align-items: center; gap: 1em; margin: .3em 0 .2em; }
  .icon { width: 8em; height: 8em; flex: none; transition: opacity .5s ease; animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-.25em); } }
  .temp { font-size: 4.6em; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; transition: opacity .4s ease; }
  .temp.out { opacity: 0; }
  .temp sup { font-size: .35em; font-weight: 400; opacity: .7; vertical-align: top; position: relative; top: .35em; margin-inline-start: .1em; }
  .cond { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.5em; margin-bottom: .5em; }
  .cond small { font-size: 1.1em; opacity: .75; text-align: left; }

  .stat { display: flex; align-items: center; gap: .5em; font-size: 1.5em; color: #cfe0f0; border-top: 1px solid rgba(255,255,255,.16); padding-top: .5em; transition: opacity .4s ease; }
  .stat.out { opacity: 0; }
  .stat svg { width: 1.2em; height: 1.2em; flex: none; }
  .stat b { color: #fff; font-weight: 600; margin-inline-start: auto; }
  #card.old .stat::after { content: "•"; color: #E8A33D; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-sun" viewBox="0 0 64 64"><circle cx="32" cy="32" r="11" fill="#FFC21A"/><g stroke="#FFC21A" stroke-width="4" stroke-linecap="round"><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l5.5 5.5M43.5 43.5L49 49M15 49l5.5-5.5M43.5 20.5L49 15"/></g></symbol>
<symbol id="i-moon" viewBox="0 0 64 64"><path transform="translate(3 0)" d="M28.63 10.03A22 22 0 1 0 51.13 38.15A18 18 0 0 1 28.63 10.03Z" fill="#E8EEF8"/><circle cx="52" cy="14" r="2" fill="#E8EEF8"/><circle cx="57" cy="26" r="1.5" fill="#E8EEF8"/></symbol>
<symbol id="i-part" viewBox="0 0 64 64"><circle cx="24" cy="24" r="9" fill="#FFC21A"/><g stroke="#FFC21A" stroke-width="3.5" stroke-linecap="round"><path d="M24 7v5M7 24h5M12 12l3.5 3.5M36 12l-3.5 3.5"/></g><path d="M20 52a9 9 0 0 1 0-18 12 12 0 0 1 23-3 10 10 0 0 1 4 21z" fill="#F2F6FB"/></symbol>
<symbol id="i-partnight" viewBox="0 0 64 64"><path transform="translate(2 -2) scale(.55)" d="M28.63 10.03A22 22 0 1 0 51.13 38.15A18 18 0 0 1 28.63 10.03Z" fill="#E8EEF8"/><path d="M20 52a9 9 0 0 1 0-18 12 12 0 0 1 23-3 10 10 0 0 1 4 21z" fill="#C9D3E2"/></symbol>
<symbol id="i-cloud" viewBox="0 0 64 64"><path d="M18 50a10 10 0 0 1 0-20 14 14 0 0 1 27-3 11 11 0 0 1 4 23z" fill="#D5DDE8"/></symbol>
<symbol id="i-rain" viewBox="0 0 64 64"><path d="M18 38a10 10 0 0 1 0-20 14 14 0 0 1 27-3 11 11 0 0 1 4 23z" fill="#B8C4D4"/><g stroke="#4DB3FF" stroke-width="4" stroke-linecap="round"><path d="M22 46l-3 8M33 46l-3 8M44 46l-3 8"/></g></symbol>
<symbol id="i-storm" viewBox="0 0 64 64"><path d="M18 36a10 10 0 0 1 0-20 14 14 0 0 1 27-3 11 11 0 0 1 4 23z" fill="#8E9BB0"/><path d="M35 34l-8 13h7l-4 12 12-16h-7l4-9z" fill="#FFC21A"/></symbol>
<symbol id="i-dust" viewBox="0 0 64 64"><circle cx="32" cy="22" r="10" fill="#E8A33D"/><g stroke="#D9A066" stroke-width="4" stroke-linecap="round" fill="none"><path d="M8 38h34a5 5 0 1 0-5-5M8 47h42a5 5 0 1 1-5 5M8 56h22"/></g></symbol>
<symbol id="i-haze" viewBox="0 0 64 64"><circle cx="32" cy="24" r="10" fill="#F2C566"/><g stroke="#C9CFD8" stroke-width="4" stroke-linecap="round"><path d="M10 40h44M16 48h32M10 56h44"/></g></symbol>
<symbol id="i-wind" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></g></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" fill="none"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></symbol>
<symbol id="i-feel" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/></g></symbol>
</defs>
</svg>

<div id="card">
  <div class="head">
    <div class="city">Riyadh<span>الرياض</span></div>
  </div>
  <div class="main">
    <svg class="icon" id="icon"><use href="#i-sun"/></svg>
    <div class="temp"><span id="temp">--</span><sup id="unit">°C</sup></div>
  </div>
  <div class="cond"><span id="cond-en">Loading…</span><small id="cond-ar"></small></div>
  <div class="stat" id="stat"><svg><use id="stat-i" href="#i-feel"/></svg><span id="stat-l">Feels like</span><b id="stat-v">--</b></div>
</div>

<script>
(() => {
  // Optional URL params: ?scale=1.5&accent=%23c8102e
  const q = new URLSearchParams(location.search);
  if (q.get('scale')) document.documentElement.style.setProperty('--scale', q.get('scale'));
  if (q.get('bg') === '1') document.getElementById('card').classList.add('panel');
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));

  const LAT = 24.7136, LON = 46.6753, TZ = 'Asia/Riyadh';
  const REFRESH_MS = 10 * 60 * 1000;
  const CACHE_KEY = 'riyadh-weather-v1';
  const $ = id => document.getElementById(id);

  // condition key -> [day icon, night icon, English, Arabic]
  const C = {
    clear:   ['i-sun',  'i-moon',      'Clear',          'صافٍ'],
    mainly:  ['i-sun',  'i-moon',      'Mostly clear',   'صافٍ غالباً'],
    part:    ['i-part', 'i-partnight', 'Partly cloudy',  'غائم جزئياً'],
    cloud:   ['i-cloud','i-cloud',     'Overcast',       'غائم'],
    haze:    ['i-haze', 'i-haze',      'Hazy',           'ضباب خفيف'],
    dust:    ['i-dust', 'i-dust',      'Dusty',          'غبار'],
    sand:    ['i-dust', 'i-dust',      'Sandstorm',      'عاصفة رملية'],
    rain:    ['i-rain', 'i-rain',      'Rain',           'أمطار'],
    storm:   ['i-storm','i-storm',     'Thunderstorm',   'عاصفة رعدية'],
  };

  function classify(code, visKm, dust) {
    if (code >= 95) return 'storm';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
    // Dust model values run high, so visibility must confirm before we show dust/sandstorm.
    const lowVis = visKm != null;
    if (lowVis && visKm < 3 && (dust == null || dust >= 300 || code <= 3)) return 'sand';
    if (lowVis && visKm < 5 && code <= 3) return 'dust';
    if (lowVis && visKm < 10 && dust != null && dust >= 150 && code <= 3) return 'dust';
    if (code === 45 || code === 48) return 'haze';
    if (visKm != null && visKm < 8 && code <= 3) return 'haze';
    if (code === 0) return 'clear';
    if (code === 1) return 'mainly';
    if (code === 2) return 'part';
    return 'cloud';
  }

  function render(d, stale) {
    const key = classify(d.code, d.visKm, d.dust);
    const [dayI, nightI, en, ar] = C[key];
    const icon = d.isDay ? dayI : nightI;
    const use = $('icon').firstElementChild;
    if (use.getAttribute('href') !== '#' + icon) {
      $('icon').style.opacity = 0;
      setTimeout(() => { use.setAttribute('href', '#' + icon); $('icon').style.opacity = 1; }, 450);
    }
    cur = d;
    applyUnits();
    $('cond-en').textContent = en;
    $('cond-ar').textContent = ar;
    $('card').classList.toggle('old', !!stale);
    $('card').classList.add('on');
  }

  async function fetchJson(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  async function update() {
    try {
      const w = await fetchJson(
        `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,visibility` +
        `&timezone=${encodeURIComponent(TZ)}`);
      let dust = null;
      try {
        const a = await fetchJson(
          `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=dust&timezone=${encodeURIComponent(TZ)}`);
        dust = a.current.dust;
      } catch (e) { /* dust is optional */ }
      const c = w.current;
      const d = {
        temp: c.temperature_2m, feel: c.apparent_temperature, hum: c.relative_humidity_2m,
        wind: c.wind_speed_10m, code: c.weather_code, isDay: c.is_day === 1,
        visKm: c.visibility == null ? null : c.visibility / 1000, dust,
      };
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
      render(d, false);
    } catch (e) {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (cached) render(cached, true);
      } catch (e2) {}
    }
  }

  // Temperature alternates °C / °F on the same cadence as the detail line.
  let cur = null, useF = false;
  const deg = c => Math.round(useF ? c * 9 / 5 + 32 : c);
  function applyUnits() {
    if (!cur) return;
    $('temp').textContent = deg(cur.temp);
    $('unit').textContent = useF ? '°F' : '°C';
    const d = cur;
    const vis = d.visKm == null ? '--' : (d.visKm >= 10 ? '10+' : d.visKm.toFixed(1).replace(/\.0$/, ''));
    stats = [
      ['i-feel', 'Feels like', deg(d.feel) + '°'],
      ['i-wind', 'Wind', Math.round(d.wind) + ' km/h'],
      ['i-drop', 'Humidity', Math.round(d.hum) + '%'],
      ['i-eye',  'Visibility', vis + ' km'],
    ];
    showStat(false);
  }
  setInterval(() => {
    const t = document.querySelector('.temp'), s = $('stat');
    t.classList.add('out'); s.classList.add('out');
    setTimeout(() => { useF = !useF; applyUnits(); t.classList.remove('out'); s.classList.remove('out'); }, 400);
  }, 10000);

  // Rotate one detail at a time so the text can stay large.
  const STAT_MS = 10000;
  let stats = [], si = 0;
  function showStat(advance) {
    if (!stats.length) return;
    if (advance) si = (si + 1) % stats.length;
    si = si % stats.length;
    const [i, l, v] = stats[si];
    $('stat-i').setAttribute('href', '#' + i);
    $('stat-l').textContent = l;
    $('stat-v').textContent = v;
  }
  setInterval(() => {
    const el = $('stat');
    el.classList.add('out');
    setTimeout(() => { showStat(true); el.classList.remove('out'); }, 400);
  }, STAT_MS);

  update(); setInterval(update, REFRESH_MS);
})();
</script>
</body>
</html>
